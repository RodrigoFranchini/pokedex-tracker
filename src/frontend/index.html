<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-bottom) non-zero, and
      the fixed dock uses it to keep its face off the home indicator.
      interactive-widget=resizes-content shrinks the layout so the dock rides
      above the on-screen keyboard instead of under it when search opens.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#5c1622" />
    <meta
      name="description"
      content="Track your Paldea Pokedex progress in Pokemon Scarlet and Violet."
    />
    <title>Paldea Dex — Pokedex Tracker</title>
    <script>
      // Applies the saved colour before the app mounts. Without this the page
      // paints the default first and then snaps to the saved world, which
      // reads as a bug rather than as a preference being restored.
      //
      // The fallback here must match DEFAULT_THEME in storage/progress.ts.
      try {
        var saved = JSON.parse(localStorage.getItem('pokedex-tracker') || '{}')
        document.documentElement.dataset.theme =
          saved && saved.settings && saved.settings.theme === 'violet' ? 'violet' : 'scarlet'
      } catch (error) {
        document.documentElement.dataset.theme = 'scarlet'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
