<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!--
    The app in miniature: the scarlet ground, the ink frame, the light panel
    the list sits in, and one filled mark. Same four surfaces as the page, same
    single clipped corner on each — 45 degrees, top right, never a radius.

    Colours are the literal values of --ground, --ink, --panel and --scarlet in
    src/styles/tokens.css. They are inlined because a favicon is fetched with
    no stylesheet; if a token moves, move it here too.

    Fixed to the scarlet world on purpose. The panel is light in both themes
    and the mark never moves, so the mark reads either way — but a favicon is
    a single file the browser caches, not something that can follow the saved
    theme, and scarlet is the default world.
  -->
  <rect width="32" height="32" fill="#5c1622" />
  <path d="M2 2 H24 L30 8 V30 H2 Z" fill="#221b33" />
  <path d="M5 5 H22 L27 10 V27 H5 Z" fill="#edebf3" />
  <path d="M10 10 H19 L22 13 V22 H10 Z" fill="#e8323f" />
</svg>
