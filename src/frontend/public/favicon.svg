<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A Pokeball with the app's initial through it: red cap, white base, ink band
    and rim, on a pale blue ground so the white half still has an edge on a
    light browser chrome.

    The P is ink with a light stroke painted under the fill. That halo is what
    keeps it readable in all three places it crosses — invisible against the
    white base where the ink fill already carries it, and separating it from
    the red cap and the ink band where the fill alone would disappear.

    Colours are the literal values of the ink, panel and scarlet tokens in
    src/styles/tokens.css. They are inlined because a favicon is fetched with
    no stylesheet; if a token moves, move it here too.
  -->
  <defs>
    <clipPath id="ball">
      <circle cx="16" cy="16" r="14.6" />
    </clipPath>
  </defs>

  <rect width="32" height="32" fill="#e7eefb" />

  <g clip-path="url(#ball)">
    <rect x="1" y="1" width="30" height="15" fill="#e8323f" />
    <rect x="1" y="16" width="30" height="15" fill="#edebf3" />
    <rect x="1" y="14.8" width="30" height="2.4" fill="#221b33" />
  </g>
  <circle cx="16" cy="16" r="14.6" fill="none" stroke="#221b33" stroke-width="1.8" />

  <!--
    Blocky P, sized to leave both halves of the ball reading around it. The
    counter is punched wide on purpose: any smaller and at 16px it collapses
    into a dot rather than the hole of a P.
  -->
  <path
    d="M11 8 H21 V17.5 H15 V25 H11 Z M14.9 10.2 H18.6 V15.2 H14.9 Z"
    fill-rule="evenodd"
    fill="#221b33"
    stroke="#edebf3"
    stroke-width="1.4"
    paint-order="stroke"
    stroke-linejoin="round"
  />
</svg>
