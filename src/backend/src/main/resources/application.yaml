server:
  # The host assigns the port in production. 8080 keeps local runs unchanged.
  port: ${PORT:8080}

spring:
  application:
    name: pokedex-tracker

  jpa:
    hibernate:
      # Flyway owns the schema, exclusively. If Hibernate also generates DDL the
      # two disagree silently and the migration history stops describing reality.
      ddl-auto: validate
    # Boot defaults this on. It holds a database session open for the whole
    # request so lazy loading works from a controller -- convenient, and a
    # well-known way to leak connections under load. Off from the start.
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        # Health only. The default set is small, but Actuator can expose
        # environment and configuration, so widen it deliberately or not at all.
        include: health

app:
  auth:
    # Dev fallback only. Production sets JWT_SECRET, and rotating it logs
    # everyone out, which is the intended way to revoke every session.
    jwt-secret: ${JWT_SECRET:local-development-secret-not-for-production-use-min-32-bytes}
    token-expiry: 7d
    # Secure cookies are not sent over plain http, so local dev would never
    # receive one. Production sets this true.
    cookie-secure: ${COOKIE_SECURE:false}

